# Place at the REPO ROOT: D:\Job Seeker\Job Hunter\netlify.toml
# A root-level config is always read, and overrides the Netlify UI settings.

[build]
  # Everything below is resolved relative to this directory.
  base    = "v3/dashboard"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
